title: Use visual urgency indicators for maintenance status
domain: dom_2pr5dqn8
intent: >-
  Vehicle health status should be immediately apparent through color coding and visual cues rather than requiring users
  to read detailed text
anti-patterns:
  - Burying urgency information in text
  - Using unclear or inconsistent color coding
  - Requiring users to interpret complex status information
