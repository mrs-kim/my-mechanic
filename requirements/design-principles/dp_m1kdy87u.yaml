id: dp_m1kdy87u
type: design-principle
title: Visual urgency hierarchy for maintenance status
domain: dom_jznd7ho7
intent: >-
  Use progressive visual intensity to communicate maintenance urgency — pulsing animations for immediate attention,
  color coding for status levels, and clear visual separation between urgent and routine items
anti-patterns:
  - Using same visual treatment for overdue and routine items
  - Hiding urgency indicators
  - Making all maintenance items look equally important
owner-team: design-team
