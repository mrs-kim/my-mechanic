id: dp_01ydbsdy
type: design-principle
title: Clear visual hierarchy for maintenance urgency
domain: dom_az9ix51b
intent: >-
  Users should immediately understand which maintenance items need immediate attention versus those that are fine, using
  color coding and visual indicators to create obvious priority levels
anti-patterns:
  - Using similar colors for different urgency levels
  - Burying critical maintenance needs in long lists
  - Making all maintenance items look equally important
owner-team: design-team
status:
  legitimacy: proposed
  lifecycle: active
