title: Progressive disclosure of maintenance information
domain: dom_az9ix51b
intent: >-
  Maintenance information should be layered so users get overview first but can drill down into details when needed,
  avoiding overwhelming them with too much information at once
anti-patterns:
  - Showing all maintenance details at once
  - Hiding important summary information
  - Making users hunt for basic status information
