title: Visual data source transparency
domain: dom_fhtdpco8
intent: >-
  Users should immediately understand whether service data came from automated receipt processing or manual entry
  through visual cues
anti-patterns:
  - Making receipt and manual entries look identical
  - Hiding the data source
  - Using subtle differences that are hard to distinguish
