type: design-principle
title: Visual hierarchy for maintenance urgency
domain: dom_4s00lafl
intent: >-
  Use progressive visual intensity to communicate maintenance priority - strongest visual treatment for overdue items,
  moderate for due soon, and subtle for future items
anti-patterns:
  - Uniform visual treatment regardless of urgency
  - Overwhelming visual noise that obscures priority
