title: Progressive visual disclosure
domain: dom_fhtdpco8
intent: >-
  Information should be revealed progressively with staggered timing to create engaging, digestible experiences rather
  than overwhelming users with simultaneous content
anti-patterns:
  - Simultaneous appearance of all content
  - No visual progression or hierarchy
  - Instant state changes without transitions
