id: dp_igkjujtr
type: design-principle
title: Focus on status over items
domain: dom_btetyae4
intent: >-
  Casual drivers think 'am I good, or do I need to go to the shop?' rather than in individual line items. The interface
  should reflect this mental model of overall car health rather than detailed checklists.
anti-patterns:
  - Showing detailed maintenance checklists
  - Making users think about individual service items
  - Presenting information as a mechanic would see it
owner-team: design-team
status:
  legitimacy: proposed
  lifecycle: active
