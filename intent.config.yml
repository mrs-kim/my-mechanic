# intent.config.yml — generated by intent init
# Edit this file to configure the harness for your project.

product:
  name: "Pitcrew AI"
  description: ""

github:
  org: "mrs-kim"
  repo: "my-mechanic"

design-system:
  repo: ""

teams:
  - name: core-team
    github-team: "@mrs-kim/core-team"
  - name: design-team
    github-team: "@mrs-kim/design"

agents:
  spec:
    enabled: true
    max-clarifying-questions: 2
  decision:
    enabled: true
    issue-label: "decision-needed"
  trace:
    enabled: true
    include:
      - "src/**/*.ts"
      - "src/**/*.tsx"
      - "src/**/*.js"
    exclude:
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/node_modules/**"
  test:
    enabled: false

enforcement:
  warn-only: true
  unbuilt-warning-days: 30
